name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Architecture invariants
        run: php scripts/check-architecture.php
      - name: Patch and checksum tests
        run: php tests/php/patch-validator-test.php
      - name: Scoped exchange tests
        run: php tests/php/element-locator-test.php
      - name: JavaScript syntax
        run: |
          node --check assets/admin.js
          node --check assets/editor.js
