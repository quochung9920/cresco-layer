name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Architecture invariants
        run: php scripts/check-architecture.php
      - name: Snapshot coordinator compatibility tests
        run: php tests/php/snapshot-coordinator-compat-test.php
      - name: Capability scanner tests
        run: php tests/php/capability-scanner-test.php
      - name: Runtime discovery contract tests
        run: php tests/php/runtime-discovery-contract-test.php
      - name: AI context resolver contract tests
        run: php tests/php/context-resolver-contract-test.php
      - name: Snapshot serializer tests
        run: php tests/php/serializable-sanitizer-test.php
      - name: Runtime snapshot contract tests
        run: php tests/php/runtime-snapshot-contract-test.php
      - name: Patch contract tests
        run: php tests/php/patch-validator-test.php
      - name: Runtime control contract tests
        run: php tests/php/ai-control-contract-test.php
      - name: Fidelity policy contract tests
        run: php tests/php/fidelity-policy-contract-test.php
      - name: Checksum-free patch apply contract tests
        run: php tests/php/patch-applier-checksum-free-contract-test.php
      - name: AI package export contract tests
        run: php tests/php/package-builder-layout-context-contract-test.php
      - name: Semantic patch safety tests
        run: php tests/php/semantic-patch-guard-test.php
      - name: Scoped exchange tests
        run: php tests/php/element-locator-test.php
      - name: Runtime widget skill compiler tests
        run: php tests/php/skill-compiler-test.php
      - name: Atomic widget skill binding tests
        run: php tests/php/skill-atomic-binding-test.php
      - name: Widget skill runtime contract tests
        run: php tests/php/widget-skill-runtime-contract-test.php
      - name: Removed subsystem invariants
        run: php tests/php/no-local-ai-remnants-test.php
      - name: Design standard math tests
        run: php tests/php/design-standard-math-test.php
      - name: Design standard planning tests
        run: php tests/php/design-standard-plan-test.php
      - name: Balanced responsive design standard tests
        run: php tests/php/design-standard-responsive-test.php
      - name: Site Settings responsive foundation tests
        run: php tests/php/site-settings-responsive-foundation-test.php
      - name: Responsive foundation v2 safety tests
        run: php tests/php/responsive-foundation-v2-test.php
      - name: JavaScript quality
        run: npm run check
